---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-valkey
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-valkey
spec:
  replicas: 1
  # Never run two servers on the same data volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless-valkey
  template:
    metadata:
      labels:
        app: paperless-valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.3
          args:
            - --requirepass
            - $(VALKEYCLI_AUTH)
          env:
            # Read by valkey-cli (probes) and passed to --requirepass above
            - name: VALKEYCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: paperless-valkey-auth
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
          livenessProbe:
            tcpSocket:
              port: valkey
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-valkey
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-valkey
spec:
  selector:
    app: paperless-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
