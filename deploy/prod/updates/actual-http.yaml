---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: actual-http
spec:
  image: docker.io/jhonderson/actual-http-api
  interval: 1h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: actual-http
spec:
  imageRepositoryRef:
    name: actual-http
  policy:
    semver:
      range: ">=26.11.0"
