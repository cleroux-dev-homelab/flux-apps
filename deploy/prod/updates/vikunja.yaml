---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vikunja
spec:
  image: "docker.io/vikunja/vikunja"
  interval: 1h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vikunja
spec:
  imageRepositoryRef:
    name: vikunja
  policy:
    semver:
      range: ">=2.0.0"
