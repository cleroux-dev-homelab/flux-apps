---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: jellyfin
spec:
  image: "ghcr.io/jellyfin/jellyfin"
  interval: 1h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: jellyfin
spec:
  imageRepositoryRef:
    name: jellyfin
  filterTags:
    # Since 12.0 releases are tagged major.minor (12.4); Flux only reads x.y.z versions
    pattern: '^(?P<major>\d+)\.(?P<minor>\d+)$'
    extract: "$major.$minor.0"
  policy:
    semver:
      # New major versions need manual steps (plugins, migrations), so stay on 12.x
      range: "12.x"
