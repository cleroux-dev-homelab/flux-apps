---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  labels:
    app.kubernetes.io/name: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.31.0 # {"$imagepolicy": "flux-system:mealie"}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mealie-config
            - secretRef:
                name: mealie-oidc
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: mealie-postgres-app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: mealie-postgres-app
            - name: POSTGRES_SERVER
              valueFrom:
                secretKeyRef:
                  key: host
                  name: mealie-postgres-app
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: mealie-postgres-app
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: mealie-postgres-app
          ports:
            - name: mealie
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie
      restartPolicy: Always
