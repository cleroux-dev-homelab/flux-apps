---
apiVersion: v1
kind: Service
metadata:
  name: paperless-web
spec:
  selector:
    app.kubernetes.io/name: paperless-webserver
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless-webserver
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/name: Paperless-ngx
    gethomepage.dev/description: Documents Store
    gethomepage.dev/icon: paperless-ngx.png
spec:
  parentRefs:
    - name: private-gateway
      namespace: envoy-gateway-system
  hostnames:
    - paperless.${PRIVATE_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: paperless-web
          port: 8000
