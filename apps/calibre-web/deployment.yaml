apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre-web
    spec:
      containers:
        - name: calibre-web
          image: ghcr.io/linuxserver/calibre-web:0.6.27-ls411 # {"$imagepolicy": "flux-system:calibre-web"}
          envFrom:
            - configMapRef:
                name: calibre-web-config
          ports:
            - name: web
              containerPort: 8083
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: calibre-config
        - name: books
          persistentVolumeClaim:
            claimName: calibre-books
