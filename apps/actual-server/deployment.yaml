---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: actual-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual-server
    spec:
      containers:
        - name: actual-server
          image: ghcr.io/actualbudget/actual-server:26.11.0 # {"$imagepolicy": "flux-system:actual-server"}
          ports:
            - name: https
              containerPort: 5006
          envFrom:
            - configMapRef:
                name: actual-config
            - secretRef:
                name: actual-oidc
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-server
