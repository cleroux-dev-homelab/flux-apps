---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tx-parser
spec:
  replicas: 1
  # Never two at once: both would import and move the same emails
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tx-parser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tx-parser
    spec:
      containers:
        - name: tx-parser
          # No release tags yet: CI tags each main commit sha-<commit>
          image: ghcr.io/gcleroux/tx-parser:sha-2d5be5f
          args:
            - -config=/etc/tx-parser/config.yaml
            - -interval=15m
          volumeMounts:
            - name: config
              mountPath: /etc/tx-parser
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/tx-parser
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tx-parser-config
        - name: secrets
          secret:
            secretName: tx-parser
            items:
              - key: api-key
                path: api-key
              - key: imap-password
                path: imap-password
